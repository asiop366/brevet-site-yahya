name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:web

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Archive iOS app (unsigned)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP_SRC="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          STAGING="$RUNNER_TEMP/ipa-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/Payload"
          # ditto preserves the .app bundle structure (symlinks, resources)
          ditto "$APP_SRC" "$STAGING/Payload/App.app"
          cd "$STAGING"
          # -y keeps symlinks; required for a valid iOS app bundle inside the IPA
          zip -ry "${STAGING}/Brevet2026.ipa" Payload
          # Sanity check: IPA must contain Payload/App.app/Info.plist
          unzip -l "${STAGING}/Brevet2026.ipa" | grep -q "Payload/App.app/Info.plist"
          ls -lh "${STAGING}/Brevet2026.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: brevet2026-ios-ipa
          path: ${{ runner.temp }}/ipa-staging/Brevet2026.ipa
          retention-days: 30
